<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {{ section_name }} Result - MindAge AI
    </title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <style>

        body {

            background: linear-gradient(
                135deg,
                #f5f7ff,
                #eef2ff
            );

            min-height: 100vh;

        }


        .result-container {

            max-width: 900px;

            margin: auto;

        }


        .result-card {

            border: none;

            border-radius: 25px;

        }


        .section-icon {

            font-size: 65px;

        }


        .summary-box {

            background: #f8f9fa;

            border-radius: 18px;

            border: 1px solid #e9ecef;

        }


        .score-card {

            border: none;

            border-radius: 15px;

        }


        .score-value {

            font-size: 28px;

            font-weight: 700;

        }


        .score-bar {

            height: 10px;

            border-radius: 10px;

        }

    </style>

</head>


<body>


<!-- =====================================================
     NAVIGATION
===================================================== -->

<nav class="navbar navbar-light bg-white shadow-sm">

    <div class="container">


        <a
            class="navbar-brand fw-bold"
            href="{{ url_for('dashboard') }}"
        >

            🧠 MindAge AI

        </a>


        <a
            href="{{ url_for('history') }}"
            class="btn btn-outline-primary btn-sm"
        >

            My History

        </a>


    </div>

</nav>



<!-- =====================================================
     RESULT CONTENT
===================================================== -->

<div class="container py-5 result-container">


    <!-- Main Result -->

    <div class="card result-card shadow-sm">

        <div class="card-body p-5 text-center">


            <div class="section-icon mb-3">

                {{ section_icon }}

            </div>


            <p class="text-muted mb-2">

                {{ section_name }}

            </p>


            <h1 class="fw-bold mb-4">

                {{ result.result_title }}

            </h1>


            <!-- Profile Summary -->

            <div class="summary-box p-4 text-start">


                <h4 class="fw-bold mb-3">

                    Profile Summary

                </h4>


                <p class="mb-0 text-muted">

                    {{ result.profile_description }}

                </p>


            </div>


        </div>

    </div>



    <!-- =================================================
         SCORE CARDS
    ================================================= -->

    <div class="row g-4 mt-2">


        {% for name, value in scores.items() %}


        <div class="col-md-4">


            <div class="card score-card shadow-sm h-100">


                <div class="card-body text-center p-4">


                    <h5 class="text-capitalize">

                        {{ name|replace("_", " ") }}

                    </h5>


                    <div class="score-value text-primary mt-2">

                        {{ value }}%

                    </div>


                    <div
                        class="progress score-bar mt-3"
                        role="progressbar"
                        aria-label="{{ name }}"
                        aria-valuenow="{{ value }}"
                        aria-valuemin="0"
                        aria-valuemax="100"
                    >


                        <div
                            class="progress-bar"
                            data-score="{{ value }}"
                        >
                        </div>


                    </div>


                </div>

            </div>


        </div>


        {% endfor %}


    </div>



    <!-- =================================================
         NAVIGATION BUTTONS
    ================================================= -->

    <div class="text-center mt-5">


        <a
            href="{{ url_for('dashboard') }}"
            class="btn btn-primary px-4"
        >

            ← Back to Dashboard

        </a>


        <a
            href="{{ url_for('history') }}"
            class="btn btn-outline-secondary px-4 ms-2"
        >

            View History

        </a>


    </div>


</div>



<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script>

document
    .querySelectorAll(".progress-bar")
    .forEach(
        function (bar) {

            const score =
                bar.getAttribute("data-score");

            bar.style.width =
                score + "%";

        }
    );

</script>


</body>

</html>
