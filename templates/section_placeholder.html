<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{{ section_name }} - MindAge AI</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            background: linear-gradient(
                135deg,
                #f5f7ff,
                #eef2ff
            );

            min-height: 100vh;
        }

        .placeholder-card {
            max-width: 650px;
            margin: 100px auto;
            border: none;
            border-radius: 25px;
        }

        .section-icon {
            font-size: 80px;
        }

    </style>

</head>


<body>


<!-- Navigation -->

<nav class="navbar navbar-light bg-white shadow-sm">

    <div class="container">

        <a
            class="navbar-brand fw-bold"
            href="{{ url_for('dashboard') }}"
        >
            🧠 MindAge AI
        </a>

        <a
            href="{{ url_for('dashboard') }}"
            class="btn btn-outline-primary btn-sm"
        >
            ← Dashboard
        </a>

    </div>

</nav>


<!-- Section Placeholder -->

<div class="container">

    <div class="card shadow-sm placeholder-card">

        <div class="card-body text-center p-5">


            <div class="section-icon mb-4">

                {{ section_icon }}

            </div>


            <h1 class="fw-bold mb-3">

                {{ section_name }}

            </h1>


            <p class="lead text-muted">

                {{ description }}

            </p>


            <div class="alert alert-info mt-4">

                🚧 This section is currently being built.

                <br>

                Your questions and personalized analysis
                will be added here next.

            </div>


            <a
                href="{{ url_for('dashboard') }}"
                class="btn btn-primary mt-3"
            >

                Back to Dashboard

            </a>


        </div>

    </div>

</div>


</body>

</html>
